<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack Standard 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#140f2b; --sky2:#2a1850; --grass:#12301c; --purple:#e0a93a; --purple-d:#b8842a; --glow:47,160,140; --gold:#e8b44a; --text:#f3eefc; --muted:#a99cc4;
}
:root[data-theme="light"]{ --sky:#2a2150; --sky2:#43307a; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#140f2b; } }
:root[data-theme="dark"]{ --sky:#140f2b; }
html{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;color:var(--text);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--sky);
}
.scene{
  position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(ellipse 70% 40% at 50% 38%, rgba(47,160,140,.28), transparent 70%),
    linear-gradient(180deg,var(--sky) 0%,var(--sky2) 48%,#1b2a3a 62%,var(--grass) 78%,#0a1d10 100%);
  overflow:hidden;
}
/* luzes do estádio desfocadas */
.lights{position:absolute;inset:0;pointer-events:none}
.lights span{position:absolute;border-radius:50%;filter:blur(18px);opacity:.45;background:#fff4d8}
/* relva */
.grass{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 60px,transparent 60px 120px),
    radial-gradient(ellipse 60% 70% at 50% 0%,rgba(90,180,90,.25),transparent 70%);
  -webkit-mask:linear-gradient(to bottom,transparent,#000 30%);mask:linear-gradient(to bottom,transparent,#000 30%);
}
.stage{position:relative;perspective:1100px;z-index:2;display:flex;flex-direction:column;align-items:center}
.float{animation:bob 4.2s ease-in-out infinite}
.pack{
  position:relative;width:min(300px,62vw);aspect-ratio:610/975;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);
  cursor:grab;touch-action:none;will-change:transform;
}
.pack.dragging{transition:none}
.pack img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 18px 30px rgba(20,0,50,.55)) drop-shadow(0 0 40px rgba(47,160,140,.35));}

.glare{mix-blend-mode:overlay;opacity:.9;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.75),rgba(255,255,255,0) 45%);}
.sweep{mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 35%,rgba(255,235,190,.35) 48%,rgba(160,255,225,.28) 52%,transparent 65%) no-repeat;
  background-size:250% 100%;animation:sweep 5.5s ease-in-out infinite;}
.shadow{width:min(220px,46vw);height:26px;margin-top:26px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.6),transparent 70%);
  animation:shadow 4.2s ease-in-out infinite}
.info{position:relative;z-index:2;text-align:center;margin-top:18px}
.info h1{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:1.25rem;letter-spacing:.2em;margin:0;color:var(--muted)}
.price{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:2.8rem;line-height:1;color:var(--purple);margin:.2rem 0 .8rem}
button{font:700 1rem "Manrope",system-ui,sans-serif;color:#1c0b33;background:var(--purple);border:0;border-radius:999px;padding:.8rem 2.4rem;cursor:pointer;
  box-shadow:0 6px 24px rgba(224,169,58,.4);transition:transform .15s,background .15s}
button:hover{background:#ecbb55}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{font-size:.8rem;color:var(--muted);margin-top:.8rem;opacity:.8}
.pack.shake{animation:shake .6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.78);opacity:.55}}
@keyframes sweep{0%,55%{background-position:120% 0}100%{background-position:-120% 0}}
@keyframes shake{0%,100%{translate:0}20%{translate:-8px 0;rotate:-3deg}40%{translate:8px 0;rotate:3deg}60%{translate:-6px 0;rotate:-2deg}80%{translate:5px 0;rotate:1deg}}
@media (prefers-reduced-motion: reduce){
  .float,.shadow,.sweep,.pack.shake{animation:none}
}
@media (max-height:640px){.pack{width:min(210px,50vw)}.price{font-size:2.2rem}}
</style>
</head>

<script>
(function(){
  // luzes do estádio
  var L=document.getElementById('lights');
  var spots=[[8,30,90],[20,34,70],[33,31,60],[70,32,70],[83,30,95],[93,34,60],[50,26,50]];
  spots.forEach(function(s){var e=document.createElement('span');e.style.left=s[0]+'%';e.style.top=s[1]+'%';e.style.width=s[2]+'px';e.style.height=(s[2]*.6)+'px';L.appendChild(e);});

  var pack=document.getElementById('pack');
  var MAX=14, LIM_X=14, LIM_Y=18, dragging=false, sx=0, sy=0;
  function tilt(rx,ry,gx,gy){
    pack.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
    pack.style.setProperty('--gx',gx+'%');pack.style.setProperty('--gy',gy+'%');
  }
  function fromPoint(x,y){
    var r=pack.getBoundingClientRect();
    var px=Math.max(-1,Math.min(1,(x-(r.left+r.width/2))/(window.innerWidth/2)));
    var py=Math.max(-1,Math.min(1,(y-(r.top+r.height/2))/(window.innerHeight/2)));
    tilt(-py*LIM_X, px*LIM_Y, 50+px*40, 35+py*40);
  }
  window.addEventListener('pointermove',function(e){
    if(dragging){
      var dx=e.clientX-sx, dy=e.clientY-sy;
      var ry=Math.max(-LIM_Y,Math.min(LIM_Y,dx/6));
      var rx=Math.max(-LIM_X,Math.min(LIM_X,-dy/8));
      pack.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
      pack.style.setProperty('--gx',(50+ry*2)+'%');pack.style.setProperty('--gy',(35-rx*2)+'%');
    } else if(e.pointerType==='mouse'){ fromPoint(e.clientX,e.clientY); }
  });
  pack.addEventListener('pointerdown',function(e){dragging=true;sx=e.clientX;sy=e.clientY;pack.classList.add('dragging');pack.setPointerCapture(e.pointerId);});
  function end(){ if(!dragging)return; dragging=false; pack.classList.remove('dragging'); tilt(0,0,50,30); }
  pack.addEventListener('pointerup',end); pack.addEventListener('pointercancel',end);
  document.addEventListener('mouseleave',function(){ if(!dragging) tilt(0,0,50,30); });

  document.getElementById('buy').addEventListener('click',function(){
    pack.classList.remove('shake'); void pack.offsetWidth; pack.classList.add('shake');
  });
})();
</script>
